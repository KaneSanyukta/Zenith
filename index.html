<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kamban</div>
            <div class="right"><button id="task-toggle">Add new Task</button></div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="headding">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>
                <div draggable="true" class="task">
                    <h2>Task 1</h2>
                    <p>Description</p>
                    <button>Delete</button>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="headding">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>
                
            </div>
            <div id="done" class="task-column">
                <div class="headding">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>

    <div class="model add-new-task">
        <input type="text" placeholder="Task title">
        <textarea name="description" id="description" placeholder="Description"></textarea>
        <button id="add-new-task">Add Task</button>
    </div>
</body>
<script src="script.js"></script>
</html>
